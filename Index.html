
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KOS Engine Panel</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      background: #0b1020;
      color: #f4f6ff;
      font-family: Arial, sans-serif;
    }
    main { max-width: 600px; margin: auto; }
    h1 { color: #8b9cff; }
    .card {
      background: #171f35;
      border: 1px solid #303c59;
      border-radius: 14px;
      padding: 20px;
      margin: 16px 0;
    }
    .balance { font-size: 36px; font-weight: bold; }
    button {
      background: #7185ff;
      color: white;
      border: 0;
      padding: 12px 16px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    small { color: #b4bfd8; }
  </style>
</head>
<body>
  <main>
    <h1>KOS Engine</h1>
    <p>Reseller Dashboard</p>

    <section class="card">
      <small>USD Wallet Balance</small>
      <div class="balance">$0.00</div>
      <p><small>Demo preview — not a real wallet.</small></p>
    </section>

    <h2>Wallet Top-up</h2>

    <section class="card">
      <h3>$10 — ₹800</h3>
      <button onclick="alert('Checkout setup pending')">
        Select Plan
      </button>
    </section>

    <section class="card">
      <h3>$25 — ₹1,500</h3>
      <button onclick="alert('Checkout setup pending')">
        Select Plan
      </button>
    </section>

    <section class="card">
      <h3>$50 — ₹2,500</h3>
      <button onclick="alert('Checkout setup pending')">
        Select Plan
      </button>
    </section>

    <p><small>
      Secure login, verified payments and license management
      will be added with a backend.
    </small></p>
  </main>
</body>
</html>
